version: '3.8'

services:
  # Backend NestJS (API)
  api:
    build: 
      context: ./backend
      target: development
    container_name: cudii_api
    restart: unless-stopped
    networks:
      - cudii_net
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${API_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${POSTGRES_DB}?schema=public
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npm run start:dev

  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: cudii_postgres
    restart: unless-stopped
    networks:
      - cudii_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cudii_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cudii_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-cudii_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cudii_admin} -d ${POSTGRES_DB:-cudii_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caché Redis
  redis:
    image: redis:7-alpine
    container_name: cudii_redis
    restart: unless-stopped
    networks:
      - cudii_net
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  cudii_net:
    driver: bridge
