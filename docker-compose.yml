services:
  # Backend NestJS (API)
  api:
    build: 
      context: ./backend
    container_name: cudii_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - cudii_net
    volumes:
      - ./backend:/usr/src/app
      - api_node_modules:/usr/src/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - PORT=${API_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST:-postgres}:${DB_PORT:-5432}/${POSTGRES_DB}?schema=public
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # Frontend Vite (React)
  frontend:
    build: 
      context: ./frontend
    container_name: cudii_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - cudii_net
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=http://localhost:${API_PORT:-3000}
    depends_on:
      - api

  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: cudii_postgres
    restart: unless-stopped
    networks:
      - cudii_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cudii_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cudii_pass123}
      POSTGRES_DB: ${POSTGRES_DB:-cudii_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cudii_admin} -d ${POSTGRES_DB:-cudii_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caché Redis
  redis:
    image: redis:7-alpine
    container_name: cudii_redis
    restart: unless-stopped
    networks:
      - cudii_net
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
  api_node_modules:
  frontend_node_modules:

networks:
  cudii_net:
    driver: bridge
